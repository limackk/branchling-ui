<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Backlog stats</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar bar">
  <span class="brand">
    <svg class="icon brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21V9"/><path d="M7 13c0-3 2.5-5 6-5"/><path d="M13 8c0-3 2.5-5 6-5 0 3.5-2.5 6-6 5Z" fill="currentColor"/><circle cx="7" cy="6" r="2.2"/><path d="M4 21h6"/></svg>
    <h1>Backlog</h1>
  </span>
  <p class="root" id="root"></p>
</header>
<main id="main" class="page" tabindex="-1">
  <section aria-labelledby="stats-title">
    <h2 id="stats-title">Stats</h2>
    <div id="stats" aria-live="polite" aria-busy="true">
      <p class="state state-loading">Loading stats…</p>
    </div>
  </section>
  <section aria-labelledby="release-title">
    <h2 id="release-title">Release pipeline</h2>
    <div id="release">
      <p class="state state-loading">Loading the release pipeline…</p>
    </div>
  </section>
</main>
</body>
</html>
