<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Backlog stats</title>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <h1>Backlog</h1>
  <p class="root" id="root"></p>
</header>
<main id="main" tabindex="-1">
  <section aria-labelledby="stats-title">
    <h2 id="stats-title">Stats</h2>
    <div id="stats" aria-live="polite" aria-busy="true">
      <p class="state state-loading">Loading stats…</p>
    </div>
  </section>
  <section aria-labelledby="release-title">
    <h2 id="release-title">Release pipeline</h2>
    <div id="release">
      <p class="state state-loading">Loading the release pipeline…</p>
    </div>
  </section>
</main>
</body>
</html>
